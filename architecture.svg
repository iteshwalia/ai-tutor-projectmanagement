<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">How PM Mentor works</title>
  <desc id="description">A learner uses PM Mentor in a browser. The web app handles tutoring and progress, using built-in project-management knowledge, SQLite, and Google Gemini when configured.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L10,5 L0,10 z" fill="#62748a"/>
    </marker>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; fill: #203047; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #52647a; }
      .lane-title { font-size: 17px; font-weight: 700; }
      .card-title { font-size: 16px; font-weight: 700; }
      .body { font-size: 14px; fill: #43566c; }
      .small { font-size: 12px; fill: #52647a; }
      .lane { fill: #ffffff; stroke: #d7e0eb; stroke-width: 1.5; }
      .card { fill: #f7f9fc; stroke: #cbd6e3; stroke-width: 1.4; }
      .browser { fill: #eef5ff; stroke: #9ab7dc; }
      .learning { fill: #edf8f4; stroke: #9acbb8; }
      .optional { fill: #fff7e9; stroke: #e2c48e; }
      .line { fill: none; stroke: #62748a; stroke-width: 2; marker-end: url(#arrow); }
      .dashed { stroke-dasharray: 6 5; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#f3f6fa"/>
  <text x="34" y="52" class="title">How PM Mentor works</text>
  <text x="35" y="80" class="subtitle">A learner's browser talks to PM Mentor; the server handles tutoring, progress and optional AI.</text>

  <rect x="24" y="115" width="320" height="535" rx="18" class="lane"/>
  <rect x="365" y="115" width="440" height="535" rx="18" class="lane"/>
  <rect x="826" y="115" width="350" height="535" rx="18" class="lane"/>

  <text x="48" y="151" class="lane-title">The learner</text>
  <text x="390" y="151" class="lane-title">PM Mentor service</text>
  <text x="850" y="151" class="lane-title">What the app uses</text>

  <rect x="54" y="190" width="260" height="80" rx="12" class="card"/>
  <text x="74" y="220" class="card-title">Working professional</text>
  <text x="74" y="246" class="body">Learns project management</text>

  <rect x="54" y="315" width="260" height="220" rx="14" class="browser"/>
  <text x="76" y="350" class="card-title">PM Mentor in the browser</text>
  <text x="76" y="386" class="body">Chat and lesson modes</text>
  <text x="76" y="416" class="body">Practice questions</text>
  <text x="76" y="446" class="body">Answer feedback</text>
  <text x="76" y="476" class="body">Progress summary</text>
  <text x="76" y="512" class="small">No model keys are stored here.</text>

  <rect x="400" y="190" width="370" height="100" rx="14" class="browser"/>
  <text x="424" y="224" class="card-title">Web app</text>
  <text x="424" y="251" class="body">Shows the screen and handles requests</text>
  <text x="424" y="273" class="body">Keeps browser and server responsibilities clear</text>

  <rect x="400" y="355" width="370" height="145" rx="14" class="learning"/>
  <text x="424" y="390" class="card-title">Tutor and learning tools</text>
  <text x="424" y="420" class="body">Choose questions and check answers</text>
  <text x="424" y="450" class="body">Prepare explanations and feedback</text>
  <text x="424" y="480" class="body">Update learner progress</text>

  <rect x="400" y="550" width="370" height="65" rx="12" class="optional"/>
  <text x="424" y="578" class="card-title">Private service settings</text>
  <text x="424" y="601" class="small">GEMINI_API_KEY is read on the server only</text>

  <rect x="856" y="190" width="290" height="105" rx="12" class="card"/>
  <text x="878" y="224" class="card-title">Project-management knowledge</text>
  <text x="878" y="252" class="body">Question bank and built-in help</text>
  <text x="878" y="276" class="small">Available even without an AI key</text>

  <rect x="856" y="355" width="290" height="125" rx="12" class="card"/>
  <text x="878" y="390" class="card-title">Learner progress</text>
  <text x="878" y="420" class="body">Profile, current question and results</text>
  <text x="878" y="450" class="body">Saved in a SQLite file</text>

  <rect x="856" y="535" width="290" height="80" rx="12" class="optional"/>
  <text x="878" y="568" class="card-title">Model provider (optional)</text>
  <text x="878" y="593" class="body">Gemini or a compatible API</text>

  <path d="M184 270 L184 310" class="line"/>
  <path d="M314 370 L394 258" class="line"/>
  <path d="M400 277 L324 410" class="line dashed"/>
  <text x="322" y="321" class="small">questions and responses</text>

  <path d="M585 290 L585 350" class="line"/>
  <path d="M770 390 L850 250" class="line"/>
  <path d="M770 427 L850 418" class="line"/>
  <path d="M770 470 L850 565" class="line"/>
  <path d="M585 545 L585 505" class="line dashed"/>

  <text x="35" y="690" class="small">On Render Free, local SQLite data may reset after a restart. Use persistent storage for long-term progress.</text>
</svg>
