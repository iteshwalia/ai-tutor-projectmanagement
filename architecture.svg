<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title description">
  <title id="title">PM Mentor system architecture</title>
  <desc id="description">Architecture showing the learner browser, Render-hosted Flask application, SQLite learner state, local content, and optional AI providers.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#52627a"/>
    </marker>
    <marker id="arrow-blue" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#2878c8"/>
    </marker>
    <style>
      .title { font: 700 30px Arial, sans-serif; fill: #14243a; }
      .subtitle { font: 15px Arial, sans-serif; fill: #52627a; }
      .lane-title { font: 700 18px Arial, sans-serif; fill: #35465f; }
      .card-title { font: 700 17px Arial, sans-serif; fill: #14243a; }
      .card-text { font: 14px Arial, sans-serif; fill: #52627a; }
      .small { font: 12px Arial, sans-serif; fill: #52627a; }
      .edge-label { font: 12px Arial, sans-serif; fill: #35465f; }
      .line { fill: none; stroke: #52627a; stroke-width: 2.5; marker-end: url(#arrow); }
      .api-line { fill: none; stroke: #2878c8; stroke-width: 2.8; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect width="1440" height="900" fill="#f4f7fb"/>
  <text id="title" x="720" y="48" text-anchor="middle" class="title">PM Mentor | System Architecture</text>
  <text x="720" y="76" text-anchor="middle" class="subtitle">Browser-based learning app with a Flask API, session progress, local content, and an optional server-side model connection</text>

  <rect x="28" y="112" width="292" height="710" rx="18" fill="#eaf2fc" stroke="#bfd3eb"/>
  <text x="52" y="148" class="lane-title">Learner device</text>

  <rect x="54" y="292" width="240" height="230" rx="14" fill="#ffffff" stroke="#2878c8" stroke-width="2"/>
  <text x="174" y="330" text-anchor="middle" class="card-title">Browser UI</text>
  <text x="174" y="365" text-anchor="middle" class="card-text">Jinja HTML + responsive CSS</text>
  <text x="174" y="392" text-anchor="middle" class="card-text">JavaScript ES modules</text>
  <text x="174" y="419" text-anchor="middle" class="card-text">Chat, modes, profile, progress</text>
  <line x1="84" y1="443" x2="264" y2="443" stroke="#d8e2ee"/>
  <text x="174" y="472" text-anchor="middle" class="small">Signed cookie: opaque learner ID</text>
  <text x="174" y="494" text-anchor="middle" class="small">HttpOnly | SameSite=Lax | Secure in prod</text>

  <rect x="350" y="112" width="740" height="710" rx="18" fill="#edf6f1" stroke="#bfdccc"/>
  <text x="374" y="148" class="lane-title">Render web service | HTTPS</text>

  <rect x="374" y="178" width="220" height="100" rx="12" fill="#ffffff" stroke="#4b9b74" stroke-width="2"/>
  <text x="484" y="215" text-anchor="middle" class="card-title">HTTPS ingress</text>
  <text x="484" y="243" text-anchor="middle" class="card-text">Waitress WSGI server</text>

  <rect x="630" y="178" width="430" height="100" rx="12" fill="#ffffff" stroke="#4b9b74" stroke-width="2"/>
  <text x="845" y="215" text-anchor="middle" class="card-title">Flask application</text>
  <text x="845" y="243" text-anchor="middle" class="card-text">App factory | config | security headers | blueprints</text>

  <rect x="374" y="328" width="310" height="190" rx="12" fill="#ffffff" stroke="#7b8ca5" stroke-width="2"/>
  <text x="529" y="365" text-anchor="middle" class="card-title">Learner API + assessment</text>
  <text x="529" y="395" text-anchor="middle" class="card-text">Profile and progress</text>
  <text x="529" y="422" text-anchor="middle" class="card-text">Question selection by topic</text>
  <text x="529" y="449" text-anchor="middle" class="card-text">Answer evaluation and feedback</text>
  <text x="529" y="485" text-anchor="middle" class="small">Answer keys stay on the server</text>

  <rect x="720" y="328" width="340" height="190" rx="12" fill="#ffffff" stroke="#7b8ca5" stroke-width="2"/>
  <text x="890" y="365" text-anchor="middle" class="card-title">Tutor service</text>
  <text x="890" y="395" text-anchor="middle" class="card-text">Provider selection and prompt</text>
  <text x="890" y="422" text-anchor="middle" class="card-text">Model response handling</text>
  <text x="890" y="449" text-anchor="middle" class="card-text">Demo fallback when no key is set</text>
  <text x="890" y="485" text-anchor="middle" class="small">backend/services/tutor.py</text>

  <rect x="374" y="568" width="310" height="110" rx="12" fill="#ffffff" stroke="#7b8ca5" stroke-width="2"/>
  <text x="529" y="607" text-anchor="middle" class="card-title">SQLite repository</text>
  <text x="529" y="638" text-anchor="middle" class="card-text">Learner profile and progress state</text>

  <rect x="720" y="568" width="340" height="110" rx="12" fill="#ffffff" stroke="#d39437" stroke-width="2"/>
  <text x="890" y="607" text-anchor="middle" class="card-title">Learning content</text>
  <text x="890" y="638" text-anchor="middle" class="card-text">PMP-style question bank + demo knowledge</text>

  <rect x="374" y="714" width="686" height="78" rx="12" fill="#f8fbff" stroke="#a9bdd5"/>
  <text x="717" y="745" text-anchor="middle" class="card-title">SQLite database | instance/pm_mentor.sqlite3</text>
  <text x="717" y="770" text-anchor="middle" class="small">Local persistence; Render Free filesystem is ephemeral</text>

  <rect x="1120" y="112" width="292" height="710" rx="18" fill="#fff5e8" stroke="#ead1a8"/>
  <text x="1144" y="148" class="lane-title">Optional external services</text>

  <rect x="1146" y="220" width="240" height="180" rx="12" fill="#ffffff" stroke="#d39437" stroke-width="2"/>
  <text x="1266" y="258" text-anchor="middle" class="card-title">Model API</text>
  <text x="1266" y="291" text-anchor="middle" class="card-text">Google Gemini</text>
  <text x="1266" y="318" text-anchor="middle" class="card-text">or compatible provider</text>
  <text x="1266" y="354" text-anchor="middle" class="small">HTTPS chat-completions request</text>
  <text x="1266" y="377" text-anchor="middle" class="small">Server-side bearer key</text>

  <rect x="1146" y="466" width="240" height="126" rx="12" fill="#ffffff" stroke="#d39437" stroke-width="2"/>
  <text x="1266" y="504" text-anchor="middle" class="card-title">Environment config</text>
  <text x="1266" y="533" text-anchor="middle" class="card-text">GEMINI_API_KEY preferred</text>
  <text x="1266" y="560" text-anchor="middle" class="card-text">OPENAI_API_KEY alternative</text>

  <rect x="1146" y="634" width="240" height="126" rx="12" fill="#fffaf2" stroke="#d39437"/>
  <text x="1266" y="672" text-anchor="middle" class="card-title">Privacy note</text>
  <text x="1266" y="701" text-anchor="middle" class="small">Free-tier prompts may be used</text>
  <text x="1266" y="723" text-anchor="middle" class="small">to improve provider products.</text>
  <text x="1266" y="745" text-anchor="middle" class="small">Do not send confidential data.</text>

  <path d="M294 355 H334 V228 H374" class="api-line"/>
  <text x="334" y="342" text-anchor="middle" class="edge-label">HTTPS</text>
  <path d="M594 228 H630" class="line"/>
  <text x="612" y="214" text-anchor="middle" class="edge-label">WSGI</text>
  <path d="M845 278 V300 H529 V328" class="line"/>
  <path d="M845 278 V328" class="line"/>
  <path d="M529 518 V568" class="line"/>
  <path d="M684 443 H720" class="line"/>
  <text x="702" y="430" text-anchor="middle" class="edge-label">Profile</text>
  <path d="M890 518 V568" class="line"/>
  <path d="M529 518 V540 H700 V623 H720" class="line"/>
  <path d="M529 678 V714" class="line"/>
  <path d="M1060 380 H1146" class="api-line"/>
  <text x="1103" y="366" text-anchor="middle" class="edge-label">Optional model call</text>
  <path d="M1146 529 H1100 V476 H1060" class="line"/>
  <text x="1102" y="515" text-anchor="middle" class="edge-label">Key/config</text>

  <rect x="50" y="840" width="1340" height="34" rx="8" fill="#e5ebf3"/>
  <text x="720" y="862" text-anchor="middle" class="small">Browser-to-provider calls are not made: the backend alone reads credentials and contacts an optional model.</text>
</svg>
